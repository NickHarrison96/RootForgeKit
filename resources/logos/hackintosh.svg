<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260">
  <!-- Hackintosh: bitten apple as a skull, over crossbones.
       Shown when macOS is detected on non-Apple hardware. -->
  <title>Hackintosh</title>

  <defs>
    <linearGradient id="boneShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#6E7681"/>
      <stop offset="45%"  stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="appleShine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8B949E"/>
      <stop offset="42%"  stop-color="#30363D"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
  </defs>

  <!-- ── Crossbones (behind the apple) ─────────────────────────────── -->
  <g stroke="url(#boneShine)" stroke-width="19" stroke-linecap="round" fill="none">
    <line x1="42" y1="176" x2="198" y2="242"/>
    <line x1="198" y1="176" x2="42" y2="242"/>
  </g>
  <g fill="url(#boneShine)">
    <!-- knuckle pairs at each bone end -->
    <circle cx="40"  cy="170" r="13"/><circle cx="30" cy="186" r="12"/>
    <circle cx="200" cy="170" r="13"/><circle cx="210" cy="186" r="12"/>
    <circle cx="40"  cy="248" r="13"/><circle cx="30" cy="232" r="12"/>
    <circle cx="200" cy="248" r="13"/><circle cx="210" cy="232" r="12"/>
  </g>

  <!-- ── Apple body, with the skull knocked out of it ──────────────── -->
  <g>
    <!-- leaf -->
    <path d="M132 34c6-7.4 10.1-17.6 8.9-27.7-8.6.4-19.1 5.8-25.3 13.1-5.5 6.4-10.4 16.8-9.1 26.7 9.6.8 19.5-4.9 25.5-12.1z"
          fill="url(#appleShine)"/>

    <!-- apple silhouette with skull features removed via even-odd fill -->
    <path fill-rule="evenodd" fill="url(#appleShine)" d="
      M140.6 55.4c-14 -.9 -25.8 8 -32.5 8 -6.7 0 -16.9 -7.6 -27.8 -7.4
      -14.4 .2 -27.6 8.3 -34.9 21.2 -14.9 25.9 -3.9 64.2 10.7 85.2
      7.1 10.3 15.5 21.8 26.6 21.4 10.7 -.4 14.7 -6.9 27.6 -6.9
      12.9 0 16.6 6.9 27.8 6.7 11.5 -.2 18.8 -10.5 25.8 -20.8
      8.1 -11.9 11.5 -23.5 11.7 -24.1 -.3 -.1 -22.5 -8.6 -22.7 -34.2
      -.2 -21.4 17.5 -31.7 18.2 -32.3 -10 -14.7 -25.5 -16.4 -30.5 -16.8z

      M86 96c-10.5 0 -19 7.6 -19 17 0 9.4 8.5 15 19 15 10.5 0 19 -5.6 19 -15
      0 -9.4 -8.5 -17 -19 -17z

      M154 96c-10.5 0 -19 7.6 -19 17 0 9.4 8.5 15 19 15 10.5 0 19 -5.6 19 -15
      0 -9.4 -8.5 -17 -19 -17z

      M120 132c-5 0 -9 6 -9 12s4 10 9 10 9 -4 9 -10 -4 -12 -9 -12z

      M92 160c0 -4 3 -7 7 -7s7 3 7 7v13c0 4 -3 7 -7 7s-7 -3 -7 -7z
      M113 160c0 -4 3 -7 7 -7s7 3 7 7v13c0 4 -3 7 -7 7s-7 -3 -7 -7z
      M134 160c0 -4 3 -7 7 -7s7 3 7 7v13c0 4 -3 7 -7 7s-7 -3 -7 -7z
    "/>

    <!-- hairline cracks across the shell -->
    <g stroke="#C9D1D9" stroke-width="2.2" fill="none" opacity="0.85" stroke-linecap="round">
      <path d="M62 84 L86 92 L74 104 L96 112"/>
      <path d="M150 62 L166 78 L152 86 L172 96"/>
      <path d="M104 60 L112 74 L100 80"/>
      <path d="M168 120 L182 130"/>
    </g>
  </g>
</svg>
